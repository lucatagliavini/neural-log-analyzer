#!/bin/bash
#
# tools.conf — capacità del bot: vocabolario, topologia della rete, elenco dei tool.
#
# Vive nel FRAMEWORK e non nel profilo perché non dipende dall'applicazione
# (NLP-1, 2026-08-17): il vocabolario è linguaggio naturale italiano con i
# placeholder <APP>/<LOGFILE>/<ENV>/<NODE>, e l'elenco dei tool è ciò che il bot
# SA FARE — non ciò che un cliente ha installato. Il profilo tiene le coordinate
# (dove sono i log, come si chiamano le cose) e le stringhe che l'utente legge.
#
# Sourciato da domain.conf tramite $TOOLS_CONF_FILE, risolto da
# lib/nlp-paths.sh → nlp_resolve_paths(). Un profilo può sovrascriverlo mettendo
# un proprio tools.conf: in quel caso ottiene automaticamente anche un modello
# privato (vedi NLP_CUSTOM in nlp-paths.sh), perché una topologia diversa rende
# i pesi condivisi non validi.
#
# Modificare questo file RICHIEDE riaddestramento: ./train.sh --profile <dir>
#
# Nome "tools.conf" e non "model.conf" per non confondersi con
# models/intent_classifier/model.conf, che è un artefatto GENERATO da
# nnet-init.sh/train.py (contiene architecture=, best_mse=, last_epochs=…).
#

# ─── Vocabolario ─────────────────────────────────────────────────────────────
# I due file arrivano GIÀ RISOLTI da nlp_resolve_paths(): non si usa
# l'auto-locazione `$(dirname "${BASH_SOURCE[0]}")` che c'era in domain.conf,
# perché punterebbe sempre a nlp/ e ignorerebbe un override nel profilo.
: "${UNIGRAMS_FILE:?tools.conf: UNIGRAMS_FILE non impostata — sourciare lib/nlp-paths.sh e chiamare nlp_resolve_paths prima}"
: "${BIGRAMS_FILE:?tools.conf: BIGRAMS_FILE non impostata — sourciare lib/nlp-paths.sh e chiamare nlp_resolve_paths prima}"
mapfile -t UNIGRAMS < <(grep -v '^[[:space:]]*#' "$UNIGRAMS_FILE" | grep -v '^[[:space:]]*$')
mapfile -t BIGRAMS  < <(grep -v '^[[:space:]]*#' "$BIGRAMS_FILE"  | grep -v '^[[:space:]]*$')
NUM_FEATURES=$(( ${#UNIGRAMS[@]} + ${#BIGRAMS[@]} ))

# ─── Rete neurale ─────────────────────────────────────────────────────────────
# MODEL_TOPOLOGY usa NUM_FEATURES calcolato sopra — non modificare a mano.
NUM_TOOLS=16
TOOL_THRESHOLD=0.25
MODEL_TOPOLOGY="${NUM_FEATURES},48,${NUM_TOOLS}"

# ─── Tool nell'ordine dell'output layer (indice 0..NUM_TOOLS-1) ───────────────
# L'ORDINE È IL CONTRATTO: la posizione in questo array è l'indice del neurone di
# output nei pesi. Sta nel framework proprio per questo — duplicarlo per profilo
# significa che una divergenza (due tool scambiati, uno aggiunto in mezzo)
# produce misrouting SILENZIOSO: la rete attiva il neurone 5 e il profilo lo
# interpreta come un tool diverso, senza alcun errore.
#
# Aggiungere o riordinare un tool cambia la topologia e richiede
# ./setup.sh + ./train.sh, non solo un rebuild del dataset.
TOOL_NAMES=(
    count_status
    distribute_status
    slow_requests
    traffic_volume
    filter_errors
    service_times
    gc_stats
    correlate_gc_slow
    tail_log
    filter_ip
    filter_app_errors
    tail_named_log
    grep_named_log
    show_help
    search_all_logs
    list_logs
)

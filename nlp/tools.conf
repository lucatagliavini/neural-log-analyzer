#!/bin/bash
#
# tools.conf — capacità del bot: vocabolario, topologia della rete, elenco dei tool.
#
# Vive nel FRAMEWORK e non nel profilo perché non dipende dall'applicazione
# (NLP-1, 2026-08-17): il vocabolario è linguaggio naturale italiano con i
# placeholder <APP>/<LOGFILE>/<ENV>/<NODE>, e l'elenco dei tool è ciò che il bot
# SA FARE — non ciò che un cliente ha installato. Il profilo tiene le coordinate
# (dove sono i log, come si chiamano le cose) e le stringhe che l'utente legge.
#
# Sourciato da domain.conf tramite $TOOLS_CONF_FILE, risolto da
# lib/nlp-paths.sh → nlp_resolve_paths(). Un profilo può sovrascriverlo mettendo
# un proprio tools.conf: in quel caso ottiene automaticamente anche un modello
# privato (vedi NLP_CUSTOM in nlp-paths.sh), perché una topologia diversa rende
# i pesi condivisi non validi.
#
# Modificare VOCABOLARIO, TOOL_NAMES o la sua topologia RICHIEDE riaddestramento
# (./train.sh --profile <dir>): sono il contratto della rete. TOOL_SOURCES no —
# nessun percorso di training la legge (vedi la sezione dedicata più sotto).
#
# Nome "tools.conf" e non "project.conf" per non confondersi con
# models/intent_classifier/project.conf, che è un artefatto GENERATO da
# neural-c init/train (contiene topologia, iperparametri, digest di provenienza).
#

# ─── Vocabolario ─────────────────────────────────────────────────────────────
# I due file arrivano GIÀ RISOLTI da nlp_resolve_paths(): non si usa
# l'auto-locazione `$(dirname "${BASH_SOURCE[0]}")` che c'era in domain.conf,
# perché punterebbe sempre a nlp/ e ignorerebbe un override nel profilo.
: "${UNIGRAMS_FILE:?tools.conf: UNIGRAMS_FILE non impostata — sourciare lib/nlp-paths.sh e chiamare nlp_resolve_paths prima}"
: "${BIGRAMS_FILE:?tools.conf: BIGRAMS_FILE non impostata — sourciare lib/nlp-paths.sh e chiamare nlp_resolve_paths prima}"
# La `sed` normalizza il RIEMPIMENTO DELLE COLONNE una volta sola, qui: i due file
# allineano i pattern in colonne (`errore|errori             :: 2`), quindi ogni campo
# porta spazi adiacenti a `::` che non fanno parte del pattern.
#
# Prima la ripulitura viveva in query-to-features.sh, come `${pattern// /}` dentro il
# ciclo sui pattern, e aveva due difetti (VOCFMT-1, 2026-08-24):
#
#   1. cancellava OGNI spazio, non solo il riempimento, e in modo SILENZIOSO:
#      `(^| )ultim` diventava `(^|)ultim` — un ramo vuoto nell'alternanza matcha la
#      stringa vuota in qualsiasi posizione, quindi il vincolo di confine sparisce;
#      `ultima ora` diventava `ultimaora`, che non può matchare nulla — una feature
#      MORTA, sempre 0, ancora contata in NUM_FEATURES;
#   2. girava 119 volte per query invece di una volta per file.
#
# Togliere solo gli spazi ADIACENTI a `::` fa esattamente ciò che serve — è il
# riempimento e nient'altro — e lascia intatti gli spazi voluti dentro un pattern.
# Verificato che nessun pattern attuale ha spazi interni dopo il trim, in nessuno dei
# due file, quindi il vettore di feature è invariato (parità 1171/1171 e checksum dei
# pesi lo confermano).
#
# Qui e non nel ciclo anche per prestazioni: una `sed` per file contro ~250 espansioni
# di parametro per query. Le versioni intermedie che normalizzavano nel ciclo — con
# una funzione nameref e poi inline — costavano **1,8×** su un percorso che il
# commento di query-to-features.sh dichiara ingegnerizzato (112 ms → 5 ms).
# Un solo `sed` per file fa i tre lavori che prima erano due `grep` più, nella
# versione intermedia di questa correzione, un `sed` aggiunto: scarta i commenti,
# scarta le righe vuote, normalizza il riempimento. Un processo per file invece di
# due, quindi il fix costa MENO dello stato di partenza invece di più.
_VOCAB_CLEAN='/^[[:space:]]*#/d; /^[[:space:]]*$/d; s/[[:space:]]*::[[:space:]]*/::/g'
mapfile -t UNIGRAMS < <(sed -E "$_VOCAB_CLEAN" "$UNIGRAMS_FILE")
mapfile -t BIGRAMS  < <(sed -E "$_VOCAB_CLEAN" "$BIGRAMS_FILE")
NUM_FEATURES=$(( ${#UNIGRAMS[@]} + ${#BIGRAMS[@]} ))

# ─── Rete neurale ─────────────────────────────────────────────────────────────
# MODEL_TOPOLOGY usa NUM_FEATURES calcolato sopra — non modificare a mano.
NUM_TOOLS=16
TOOL_THRESHOLD=0.25
MODEL_TOPOLOGY="${NUM_FEATURES},48,${NUM_TOOLS}"

# ─── Tool nell'ordine dell'output layer (indice 0..NUM_TOOLS-1) ───────────────
# L'ORDINE È IL CONTRATTO: la posizione in questo array è l'indice del neurone di
# output nei pesi. Sta nel framework proprio per questo — duplicarlo per profilo
# significa che una divergenza (due tool scambiati, uno aggiunto in mezzo)
# produce misrouting SILENZIOSO: la rete attiva il neurone 5 e il profilo lo
# interpreta come un tool diverso, senza alcun errore.
#
# Aggiungere o riordinare un tool cambia la topologia e richiede
# ./setup.sh + ./train.sh, non solo un rebuild del dataset.
TOOL_NAMES=(
    count_status
    distribute_status
    slow_requests
    traffic_volume
    filter_errors
    service_times
    gc_stats
    correlate_gc_slow
    tail_log
    filter_ip
    filter_app_errors
    tail_named_log
    grep_named_log
    show_help
    search_all_logs
    list_logs
)

# ─── Sorgente di log per tool (HELP-1) ─────────────────────────────────────
# Fonte di verità UNICA per "quale log apre questo tool": la stessa tabella è
# consumata da lib/dispatch.sh sia per il guard (require_tool_sources, prima
# dell'apertura del log) sia per l'help (print_help). Prima di questa tabella
# esistevano due fonti indipendenti — require_system_log nel case di dispatch
# e TOOL_CATEGORY, prosa scritta a mano in domain.conf — ed erano già
# divergenti (service_times era descritto come server log, legge l'access
# log da 60f679e del 2026-07-29).
#
# Vive nel framework, non nel profilo: diff fra i due domain.conf mostra che
# la partizione tool→sorgente è IDENTICA su liquido e usnext (NLP-1, "la
# partizione è una capacità, l'etichetta che la nomina è una coordinata" — le
# etichette stanno in SOURCE_CATEGORY/SOURCE_LABEL/ACTIVITY_CATEGORY nel
# profilo, non qui).
#
# Sintassi del valore:
#   "access"          un solo kind, richiesto sempre
#   "gc access"        SPAZIO = AND: entrambi i kind richiesti incondizionatamente
#   "access|server"    "|"    = OR runtime: UNO dei due, scelto da un selettore
#                       (per tail_log, LOG_TYPE — se non combacia con nessuna
#                       alternativa si usa la prima, che è il comportamento
#                       preesistente al di fuori di questa tabella)
#   "named"/"all"/"none" kind non di sistema: nessuna chiamata a
#                       require_system_log da questi tool. "named" risolve via
#                       NAMED_LOG_GLOB/resolve_named_log_path, "all" scopre da
#                       sé sotto LOG_SEARCH_ROOT, "none" non apre nulla.
#
# Kind concreti ("access"/"server"/"gc") DEVONO combaciare con quelli accettati
# da require_system_log (dispatch.sh) — è lo stesso identificatore, non una
# nuova enumerazione.
declare -A TOOL_SOURCES=(
    [count_status]="access"
    [distribute_status]="access"
    [slow_requests]="access"
    [traffic_volume]="access"
    [filter_errors]="server"
    [service_times]="access"
    [gc_stats]="gc"
    [correlate_gc_slow]="gc access"
    [tail_log]="access|server"
    [filter_ip]="access"
    [filter_app_errors]="server"
    [tail_named_log]="named"
    # SRCH-2: oltre ai log applicativi named, grep_named_log ora cerca anche
    # in un singolo log di sistema (server/access/gc) se SYSLOG_KIND lo indica
    # (param-extract.sh). "named" resta la prima alternativa: con selettore
    # vuoto tool_source_kinds cade su alts[0]="named", cioè il comportamento
    # preesistente resta il default e tool_help_category (usa ${first%|*})
    # lascia la voce nella categoria di oggi.
    [grep_named_log]="named|server|access|gc"
    [show_help]="none"
    [search_all_logs]="all"
    [list_logs]="all"
)

# ─── Scope multi-nodo per tool (SCOPE-1 passo 4) ───────────────────────────
# Fonte di verità UNICA per "questo tool sa girare su N nodi, e se sì cosa può
# fare con i risultati". Stessa ragione di TOOL_SOURCES per stare nel
# framework: una divergenza fra due copie produrrebbe misrouting silenzioso
# nel guard di dispatch.sh. Nessun percorso di training legge questa tabella
# (nessun retrain: NUM_TOOLS/TOOL_NAMES/vocabolario non cambiano).
#
# Due assi, non uno: lo SCOPE dice SE dispatch_tool_multinode cicla sui nodi;
# l'AGGR dice COSA si può fare coi risultati di nodi diversi. Confonderli è il
# rischio R3 — una media di pause GC su due JVM distinte non ha senso (misurato
# sul nodo 4: 127 eventi per un'app, 141 per l'altra), mentre un Sigma di
# occorrenze sull'access log è legittimo perché è una sola popolazione di
# richieste distribuita dal load balancer.
#
# Sintassi del valore, "<scope> <aggr>" (aggr omesso quando non pertinente):
#   scope multi    dispatch_tool_multinode cicla sui nodi per questo tool
#         native   il tool fa il multi-nodo DA SÉ — non ciclare (annidamento:
#                  search_all_logs parallelizza già per file su tutti i nodi)
#         single   richiede un nodo esplicito; resta il [SKIP] del passo 3
#                  (decisione utente: un tail è per natura una domanda su UN nodo)
#         none     nessun log, nessuno scope (show_help)
#   aggr  sum      grandezza additiva: la riga Sigma è legittima
#         nosum    solo righe per nodo: nessuna Sigma, nessuna media, nessun
#                  percentile fra nodi
declare -A TOOL_SCOPE=(
    [count_status]="multi sum"
    [distribute_status]="multi sum"
    [slow_requests]="multi nosum"
    [traffic_volume]="multi sum"
    [filter_errors]="multi sum"
    [service_times]="multi nosum"
    [gc_stats]="multi nosum"
    [correlate_gc_slow]="multi nosum"
    [tail_log]="single"
    [filter_ip]="multi sum"
    [filter_app_errors]="multi sum"
    [tail_named_log]="single"
    [grep_named_log]="multi sum"
    [show_help]="none"
    [search_all_logs]="native"
    [list_logs]="native"
)

# ─── Tetto di budget query-level (SCOPE-1 passo 4, punto 6) ────────────────
# Presidio contro i casi patologici (finestra molto larga su molti nodi), non
# vincolo di progetto: il dimensionamento misurato del ciclo multi-nodo è
# nell'ordine di 1-2 s dedotti su 13 nodi in parallelo (729 ms misurati per
# nodo su un tool single-source, SALPERF-1). La soglia si confronta con la
# SOMMA dei byte stimati da _estimate_multinode_bytes() su tutti i nodi
# attivi — non con un singolo file, non con un singolo tool: un tetto per
# query, perché più tool insieme (TOOL_THRESHOLD=0.25 ne attiva spesso più
# di uno) moltiplicano le esecuzioni.
#
# Il tetto MCP reale è 120 s (server) / 180 s (gunicorn), non i ~15-18,6 s
# assunti in una stima precedente del backlog (quel numero era il timeout
# client-side di un chiamante, non un vincolo del progetto) — questa soglia
# in byte resta quindi larga apposta: serve a fermare un caso davvero
# patologico, non a governare l'uso normale.
#
# 1 GiB: nessuna misura diretta lo giustifica in modo stretto (il backlog non
# fissava un valore) — è una scelta conservativa che lascia ampio margine
# sotto il secondo troncamento, quasi silenzioso, del layer MCP a valle
# (app/bot.py, max_output_bytes=8 MB su stdout, non su byte di log letti).
# Idioma di override di domain.conf ("${VAR:-default}"): un test può forzare
# una soglia piccola per esercitare il ramo di rifiuto senza fixture enormi,
# senza toccare questo file.
MULTINODE_BUDGET_BYTES="${MULTINODE_BUDGET_BYTES:-1073741824}"

#!/bin/bash
#
# system.conf — configurazione infrastrutturale per il profilo "usnext".
# Struttura directory identica a liquido ma senza log Guidewire.
#
# Modificare questo file NON richiede riaddestramento del modello.
#

# ─── Filesystem log ──────────────────────────────────────────────────────────
# TODO: sostituire con il path reale in produzione
LOG_BASE_DIR="${LOG_BASE_DIR:-/unipol/logs/usnext}"

# ─── Applicazioni disponibili su questo sistema ──────────────────────────────
DEFAULT_APP="PassInsurance"
AVAILABLE_APPS=("PassInsurance" "PassPortalClientBanca" "PassBePPEVO")

# ─── Mappa ambiente → codice nel nome host (lx<CODE>jbliq<NN>) ───────────────
# TODO: verificare i codici ambiente reali per usnext
declare -A ENV_NODE_CODE
ENV_NODE_CODE[test]="ts"
ENV_NODE_CODE[euro]="eu"
ENV_NODE_CODE[coll]="pp"
ENV_NODE_CODE[inte]="in"
ENV_NODE_CODE[cert]="ce"
ENV_NODE_CODE[prod]="pr"

# ─── Struttura directory sotto il nome host ───────────────────────────────────
APP_SUBPATH='$ENV_NAME/$APP'

# Nessun log Guidewire su questo sistema
GUIDEWIRE_SUBPATH=''

#!/bin/bash
#
# system.conf — configurazione infrastrutturale per il profilo "usnext".
#
# Tutti i valori qui sotto sono stati LETTI DAL FILESYSTEM REALE su
# lxprworkerlana01 il 2026-08-17, non ipotizzati: 12 nodi su 6 ambienti, 3904
# file di log, 12 GB. La versione precedente di questo file era uno scheletro con
# tre `# TODO` e senza i *_LOG_BASE, quindi ogni query moriva sulla validazione
# (PROF-1) — ed è la ragione per cui esiste il guard di completezza in chatbot.sh.
#
# Middleware: JBoss/Undertow con G1 GC, lo STESSO di liquido — verificato sui
# formati reali, non dedotto dal nome del profilo. Quindi i parser AWK esistenti
# valgono senza modifiche:
#   access: 10.156.7.250 [17/Aug/2026:00:03:42 +0200] "POST /portal/... " 200 187 27 ...
#   server: 2026-08-17 14:20:08,303 INFO  [com.rgigroup...] (webcontainer-worker task-4657) ...
#   gc:     [2026-08-17T00:03:46.527+0200][1486515.012s][info][gc,start] GC(44880) Pause Young ...
#
# Modificare questo file NON richiede riaddestramento del modello.
#

# ─── Filesystem log ──────────────────────────────────────────────────────────
# Layout per profilo: /unipol/logs/farmlog/<profilo>/<env>/<nodo>/<env>/<app>/
# Lo stesso schema di liquido — più profili convivono sullo stesso server.
LOG_BASE_DIR="${LOG_BASE_DIR:-/unipol/logs/farmlog/usnext}"

# Timezone del server di log (tzdata name). Vuoto = TZ di sistema.
LOG_TZ="${LOG_TZ:-Europe/Rome}"

# ─── Applicazioni disponibili su questo sistema ──────────────────────────────
# Verificate sul disco: ogni nodo ha le tre directory sotto <env>/.
DEFAULT_APP="PassInsurance"
AVAILABLE_APPS=("PassInsurance" "PassPortalClientBanca" "PassBePPEVO")

# ─── Mappa ambiente → codice nel nome host ───────────────────────────────────
# Verificati sul disco: gli stessi sei codici di liquido, con 12 nodi totali —
# cert 2 (lxcejbusal01/02), coll 2 (lxppjbusal01/02), euro 1 (lxeujbusal01),
# inte 2 (lxinjbusal01/02), prod 4 (lxprjbusal01..04), test 1 (lxtsjbusal01).
declare -A ENV_NODE_CODE
ENV_NODE_CODE[test]="ts"
ENV_NODE_CODE[euro]="eu"
ENV_NODE_CODE[coll]="pp"
ENV_NODE_CODE[inte]="in"
ENV_NODE_CODE[cert]="ce"
ENV_NODE_CODE[prod]="pr"

# ─── Nodi ────────────────────────────────────────────────────────────────────
# NODE_NAME_TEMPLATE: 'usal' dove liquido ha 'liq' — è l'unica differenza
# strutturale fra i due profili.
# Variabili disponibili: ENV_CODE (da ENV_NODE_CODE), NODE_NUM (zero-padded)
NODE_NAME_TEMPLATE='lx${ENV_CODE}jbusal${NODE_NUM}'

# NODE_HOST_REGEX: pattern ERE per riconoscere un hostname nodo nella query.
# Lo stesso di liquido: è generico sulla forma lx<2>xxx<2><cifre>, quindi copre
# sia jbliq sia jbusal senza modifiche.
NODE_HOST_REGEX='lx[a-z]{2}[a-z]+[a-z]{2}[0-9]+'

# ─── Application server ──────────────────────────────────────────────────────
SERVER_LOG_FORMAT="jboss"

# Basename (senza estensione) dei tre tipi di log su disco. Identici a liquido
# perché il middleware è lo stesso — verificato contando i file reali:
# undertow_access_log 2255, server 526, gc 414.
ACCESS_LOG_BASE="undertow_access_log"
SERVER_LOG_BASE="server"
GC_LOG_BASE="gc"

# Sinonimi con cui gli utenti nominano un log di sistema senza usarne il
# basename esatto. Serve solo per "access": server e gc coincidono già con la
# parola naturale. Senza questa mappa "errori nell'access.log" non trova il file
# (bug LOGDISC-3c su liquido, da non ripetere qui).
declare -A SYSTEM_LOG_SYNONYMS=(
    [access]="undertow_access_log"
    [accesso]="undertow_access_log"
)

# ─── Struttura directory sotto il nome host ──────────────────────────────────
# APP_SUBPATH — NON usata dal codice (vedi la nota in liquido/system.conf):
# da LOGDISC-4 i log di sistema sono SCOPERTI sotto la directory del nodo. Resta
# come documentazione del layout osservato.
#   layout osservato: <nodo>/$ENV_NAME/$APP
#
# CUSTOM_LOG_SUBPATH vuoto: a differenza di liquido (dove i log applicativi
# stanno in una sottodirectory dedicata) qui i log custom — Pass.log 40 MB,
# console.log 31 MB, audit.log, backupgc.log — stanno ACCANTO ai log di sistema
# nella stessa directory. Non serve dichiararli: dopo LOGDISC-1 sono raggiungibili
# per nome ("ultime righe del Pass.log") perché la ricerca è ricorsiva sotto il
# nodo. Il commento della versione precedente diceva "senza log applicativi
# custom": era sbagliato, e nessuno l'aveva verificato.
CUSTOM_LOG_SUBPATH=''

# LOG_NAME_HOST_PREFIX_RE non impostata: a differenza di liquido (dove tutti i
# log applicativi condividono il prefisso host "coll1nssa-"), qui i nomi
# ("Pass.log", "console.log", "audit.log", "backupgc.log") non hanno trattini.
# Il default (chiave assente) è "nessuno strip" — non c'è nulla da rimuovere.

# ─── Ricerca cross-log ───────────────────────────────────────────────────────
# 4 come liquido: il valore è tarato su I/O, non su CPU (vedi la nota in
# liquido/system.conf). Questo profilo ha 12 GB contro 8.3, quindi se le ricerche
# risultassero lente il valore va rimisurato, non alzato a intuito.
SEARCH_PARALLEL_JOBS="${SEARCH_PARALLEL_JOBS:-4}"

# ─── Log di utilizzo e performance ───────────────────────────────────────────
QUERY_LOG_RETENTION_DAYS="${QUERY_LOG_RETENTION_DAYS:-15}"
BOT_LOG_LEVEL="${BOT_LOG_LEVEL:-warn}"
BOT_LOG_FILE="${BOT_LOG_FILE:-}"
BOT_PROGRESS="${BOT_PROGRESS:-on}"

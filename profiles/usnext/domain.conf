#!/bin/bash
#
# domain.conf — configurazione del dominio applicativo per il profilo "usnext".
# Contiene: tool disponibili, descrizioni, soglia di confidenza, topologia rete.
#
# Modificare questo file RICHIEDE riaddestramento: ./train.sh --profile <dir>
#

# ─── Vocabolario ─────────────────────────────────────────────────────────────
# Legge unigrams.txt e bigrams.txt e calcola NUM_FEATURES automaticamente.
# Per modificare il vocabolario: editare solo unigrams.txt o bigrams.txt.
_DOMAIN_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
mapfile -t UNIGRAMS < <(grep -v '^[[:space:]]*#' "$_DOMAIN_DIR/unigrams.txt" | grep -v '^[[:space:]]*$')
mapfile -t BIGRAMS  < <(grep -v '^[[:space:]]*#' "$_DOMAIN_DIR/bigrams.txt"  | grep -v '^[[:space:]]*$')
NUM_FEATURES=$(( ${#UNIGRAMS[@]} + ${#BIGRAMS[@]} ))

# ─── Rete neurale ─────────────────────────────────────────────────────────────
# MODEL_TOPOLOGY usa NUM_FEATURES calcolato sopra — non modificare a mano.
NUM_TOOLS=16
TOOL_THRESHOLD=0.25
MODEL_TOPOLOGY="${NUM_FEATURES},48,${NUM_TOOLS}"

# ─── Tool nell'ordine dell'output layer (indice 0..NUM_TOOLS-1) ───────────────
TOOL_NAMES=(
    count_status
    distribute_status
    slow_requests
    traffic_volume
    filter_errors
    service_times
    gc_stats
    correlate_gc_slow
    tail_log
    filter_ip
    filter_app_errors
    tail_named_log
    grep_named_log
    show_help
    search_all_logs
    list_logs
)


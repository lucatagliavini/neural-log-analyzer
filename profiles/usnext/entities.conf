#!/bin/bash
#
# entities.conf — dizionario di normalizzazione delle entità per il profilo "usnext".
#
# Scopo: mappare nomi concreti (app, ambienti, nodi) a placeholder canonici
#        (<APP>, <ENV>, <NODE>) prima della vectorizzazione della query.
#        Questo disaccoppia il classificatore dai nomi specifici del cliente:
#        aggiungere una nuova applicazione richiede solo una riga qui, non un retrain.
#
# Sourciato da: lib/normalize-query.sh (obbligatorio), chatbot.sh, param-extract.sh
# NON richiede riaddestramento (solo la mappa cambia, non le feature).
#
# Creato il 2026-08-17 con i nomi LETTI DAL FILESYSTEM di lxprworkerlana01, non
# ipotizzati. Prima mancava del tutto: chatbot.sh lo tratta come opzionale
# (riga 96) ma normalize-query.sh lo `source` senza guardia (riga 22), quindi su
# questo profilo ogni query moriva con "No such file or directory" — asimmetria
# trovata configurando usnext, vedi ENTCONF-1 in BACKLOG.md.
#

# ─── Applicazioni → <APP> ─────────────────────────────────────────────────────
# Chiave: alias in minuscolo come appare nella query utente (case-insensitive).
# Valore: placeholder canonico.
# Ordine: dal più lungo al più corto — longest-match applicato da normalize-query.sh.
#
# Le tre app reali sono PassInsurance, PassPortalClientBanca, PassBePPEVO
# (verificate sul disco: ogni nodo ha le tre directory). Sono incluse anche le
# forme che un utente digita naturalmente, senza il prefisso "pass" o spezzate.
declare -A ENTITY_APP=(
    [passportalclientbanca]="<APP>"
    [portalclientbanca]="<APP>"
    [passinsurance]="<APP>"
    [passbeppevo]="<APP>"
    [insurance]="<APP>"
    [beppevo]="<APP>"
    [usnext]="<APP>"
    [unisalute]="<APP>"
)

# ─── Risoluzione inversa: nome app riconosciuto → label canonica ──────────────
# La chiave è il token riconosciuto nella query (minuscolo), il valore è il nome
# della directory su disco — usato per il tie-break di app in resolve_log_glob e
# per ACTIVE_APP.
declare -A APP_CANONICAL=(
    [passportalclientbanca]="PassPortalClientBanca"
    [portalclientbanca]="PassPortalClientBanca"
    [passinsurance]="PassInsurance"
    [insurance]="PassInsurance"
    [passbeppevo]="PassBePPEVO"
    [beppevo]="PassBePPEVO"
    [usnext]="PassInsurance"      # alias colloquiale del profilo → app di default
    [unisalute]="PassInsurance"   # il dominio applicativo osservato nei log
)

# ─── Ambienti → <ENV> ────────────────────────────────────────────────────────
# ENTITY_ENV è costruita dinamicamente in normalize-query.sh invertendo
# ENV_NODE_CODE di system.conf, quindi non va definita qui.
# Qui solo i sinonimi colloquiali che NON sono chiavi di ENV_NODE_CODE.
declare -A ENV_SYNONYMS=(
    [produzione]="prod"
    [integrazione]="inte"
    [collaudo]="coll"
    [certificazione]="cert"
    [europeo]="euro"
)

# ─── Log applicativi specifici del profilo ───────────────────────────────────
# Nomi (senza .log) riconosciuti da param-extract.sh per il parametro NAMED_LOG.
#
# Questa lista NON entra nel vocabolario del classificatore: il modello riconosce
# la *forma* "<nome>.log" via il placeholder <LOGFILE>, non i nomi concreti — così
# aggiungere un log qui non richiede riaddestramento (LOGF-3).
#
# I quattro nomi sono quelli realmente presenti sul disco accanto ai log di
# sistema (contati: Pass 320 file, console 323, audit 36, backupgc 29). A
# differenza di liquido non stanno in una sottodirectory dedicata, quindi
# CUSTOM_LOG_SUBPATH resta vuoto: la ricerca ricorsiva sotto il nodo (LOGDISC-1)
# li raggiunge comunque per nome.
#
# `Pass` con la maiuscola sul disco: i pattern del vocabolario sono confrontati
# sulla query minuscola (lezione di NLOG2-6), mentre param-extract.sh usa il case
# ORIGINALE per `find -name`, che è case-sensitive — quindi il nome va scritto
# qui come è su disco.
APP_LOG_NAMES=(
    Pass
    console
    audit
    backupgc
)

# ─── Abbreviazioni app → nome canonico ───────────────────────────────────────
# Nessuna abbreviazione a due lettere come cc/cm di liquido: i nomi di questo
# profilo non ne hanno una d'uso comune, e inventarne una che collide con un
# codice ambiente (ts, eu, pp, in, ce, pr) creerebbe ambiguità.
declare -A APP_SHORT_ALIASES=()

# Regex alternativa per alias multi-parola, applicata dopo ENV/NODE.
# "pass insurance" / "passinsurance" e le altre due nella stessa forma.
declare -A APP_ALIAS_REGEX=(
    [passinsurance]="pass.?insurance"
    [passportalclientbanca]="pass.?portal.?client.?banca|portal.?client.?banca"
    [passbeppevo]="pass.?be.?ppevo"
)

# ─── Nodi → <NODE> ────────────────────────────────────────────────────────────
# I nodi sono identificati da pattern numerici, non da un dizionario fisso.
# L'ultimo pattern cattura l'hostname completo: qui i nodi sono lx<code>jbusal<NN>
# (es. lxprjbusal01), quindi il pattern è sui nomi jb*, non worker*.
NODE_PATTERNS=(
    'nodo[[:space:]]*numero[[:space:]]*([0-9]+)'
    'nodo[[:space:]]*([0-9]+)'
    'worker[[:space:]]*([0-9]+)'
    'lx[a-z]+jbusal([0-9]+)'
)

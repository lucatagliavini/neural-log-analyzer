#!/bin/bash
#
# domain.conf — configurazione del dominio applicativo per il profilo "liquido".
# Contiene: tool disponibili, descrizioni, soglia di confidenza, topologia rete.
#
# Modificare questo file RICHIEDE riaddestramento: ./train.sh --profile <dir>
#

# ─── Rete neurale ─────────────────────────────────────────────────────────────
# Deve essere coerente con NUM_FEATURES in vocab.sh
NUM_TOOLS=13
TOOL_THRESHOLD=0.25
MODEL_TOPOLOGY="73,48,13"

# ─── Tool nell'ordine dell'output layer (indice 0..NUM_TOOLS-1) ───────────────
TOOL_NAMES=(
    count_status
    distribute_status
    slow_requests
    traffic_volume
    filter_errors
    service_times
    gc_stats
    correlate_gc_slow
    tail_log
    filter_ip
    filter_app_errors
    tail_named_log
    grep_named_log
)

# ─── Descrizioni leggibili ────────────────────────────────────────────────────
declare -A TOOL_DESC
TOOL_DESC[count_status]="Conta richieste HTTP per codice di stato"
TOOL_DESC[distribute_status]="Distribuisce errori per endpoint, IP o fascia oraria"
TOOL_DESC[slow_requests]="Richieste con tempo di risposta sopra soglia"
TOOL_DESC[traffic_volume]="Volume di traffico per finestra temporale"
TOOL_DESC[filter_errors]="Righe ERROR/WARN dal server.log con classe e messaggio"
TOOL_DESC[service_times]="Tempi di esecuzione servizi SOA dal server.log"
TOOL_DESC[gc_stats]="Statistiche GC: pause, heap usage, frequenza"
TOOL_DESC[correlate_gc_slow]="Correlazione tra pause GC e richieste lente"
TOOL_DESC[tail_log]="Ultime N righe di un file di log"
TOOL_DESC[filter_ip]="Traffico filtrato per indirizzo IP sorgente"
TOOL_DESC[filter_app_errors]="Errori applicativi nel server.log (status 5xx e exception loggati come INFO)"
TOOL_DESC[tail_named_log]="Ultime N righe di un log Guidewire specifico (cc.log, api.log, database.log, ...)"
TOOL_DESC[grep_named_log]="Filtra un log Guidewire per livello (ERROR/WARN/INFO) o pattern testuale"

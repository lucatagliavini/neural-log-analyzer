#!/bin/bash
#
# domain.conf — parte del dominio APPLICATIVO specifica di questo profilo ("liquido").
#
# Contiene solo ciò che nomina cose reali del cliente: le descrizioni e gli esempi
# che l'utente legge (con i nomi dei log e i nodi che esistono davvero) e le soglie
# di severità, tarabili per ambiente.
#
# Vocabolario, topologia della rete ed elenco dei tool NON sono qui: vivono in
# nlp/tools.conf, condivisi da tutti i profili (NLP-1, 2026-08-17). Il criterio è
# che il profilo contiene COORDINATE, non CAPACITÀ.
#
# Modificare le soglie non richiede riaddestramento. Modificare nlp/tools.conf sì.
#

# ─── Capacità condivise dal framework ────────────────────────────────────────
# TOOLS_CONF_FILE è risolto da lib/nlp-paths.sh → nlp_resolve_paths(), che va
# chiamata PRIMA di sourciare questo file. Porta NUM_FEATURES, NUM_TOOLS,
# TOOL_THRESHOLD, MODEL_TOPOLOGY e TOOL_NAMES.
: "${TOOLS_CONF_FILE:?domain.conf: TOOLS_CONF_FILE non impostata — sourciare lib/nlp-paths.sh e chiamare nlp_resolve_paths prima di domain.conf}"
source "$TOOLS_CONF_FILE"

# ─── Descrizioni leggibili ────────────────────────────────────────────────────
declare -A TOOL_DESC
TOOL_DESC[count_status]="Conta richieste HTTP per codice di stato"
TOOL_DESC[distribute_status]="Distribuisce errori per endpoint (path normalizzato)"
TOOL_DESC[slow_requests]="Richieste con tempo di risposta sopra soglia"
TOOL_DESC[traffic_volume]="Volume di traffico per finestra temporale"
TOOL_DESC[filter_errors]="Righe ERROR/WARN dal server.log con classe e messaggio"
TOOL_DESC[service_times]="Tempi di esecuzione servizi SOA per nome servizio, dall'access log"
TOOL_DESC[gc_stats]="Statistiche GC: pause, heap usage, frequenza"
TOOL_DESC[correlate_gc_slow]="Correlazione tra pause GC e richieste lente"
TOOL_DESC[tail_log]="Prime o ultime N righe di un file di log (es: «ultime 50 righe», «prime 20 righe»)"
TOOL_DESC[filter_ip]="Traffico filtrato per indirizzo IP sorgente"
TOOL_DESC[filter_app_errors]="Errori applicativi nel server.log (status 5xx e exception loggati come INFO)"
TOOL_DESC[tail_named_log]="Prime o ultime N righe di un log applicativo custom specifico (cc.log, api.log, database.log, ...)"
TOOL_DESC[grep_named_log]="Filtra un log applicativo custom, o cerca una stringa in un singolo log di sistema (server, gc, access), per livello (ERROR/WARN/INFO) o pattern testuale"
TOOL_DESC[show_help]="Lista degli strumenti disponibili con esempi di utilizzo"
TOOL_DESC[search_all_logs]="Cerca un pattern testuale in tutti i log del nodo, di tutte le applicazioni presenti (access, server, GC, applicativi custom) — la tabella indica la provenienza"
TOOL_DESC[list_logs]="Elenca i log realmente presenti — su un nodo se nominato, con la provenienza su tutti i nodi altrimenti (es: «che log ci sono», «quali log posso vedere»)"

# ─── Categorie nell'ordine di stampa dell'help ────────────────────────────────
HELP_CATEGORIES=(
    "Log HTTP (access log)"
    "Server log JBoss"
    "GC / JVM"
    "Log applicativi custom (cc.log, api.log, database.log…)"
    "Ricerca cross-log"
    "Esplora log del nodo"
)

# ─── Categoria per raggruppamento nell'help (HELP-1) ──────────────────────────
# Non più prosa a mano tool-per-tool: la partizione tool→sorgente è calcolata da
# TOOL_SOURCES (nlp/tools.conf, framework, capacità) via tool_source_kinds() in
# lib/dispatch.sh. Qui restano solo le ETICHETTE, coordinate di questo profilo —
# SOURCE_CATEGORY nomina il gruppo, SOURCE_LABEL è l'abbreviazione usata
# nell'annotazione inline dei tool multi-sorgente (es. "· gc + access").
declare -A SOURCE_CATEGORY=(
    [access]="Log HTTP (access log)"
    [server]="Server log JBoss"
    [gc]="GC / JVM"
    [named]="Log applicativi custom (cc.log, api.log, database.log…)"
)
declare -A SOURCE_LABEL=([access]="access" [server]="server" [gc]="gc" [named]="applicativi")

# Solo i tool con kind "all" (nessuna sorgente specifica da derivare): restano
# raggruppati per ATTIVITÀ, non per sorgente.
declare -A ACTIVITY_CATEGORY=(
    [search_all_logs]="Ricerca cross-log"
    [list_logs]="Esplora log del nodo"
)

# ─── Esempio d'uso per ogni tool (mostrato nell'help) ─────────────────────────
declare -A TOOL_EXAMPLE
TOOL_EXAMPLE[count_status]="quanti errori 500 ci sono stati stamattina"
TOOL_EXAMPLE[distribute_status]="distribuzione errori sul nodo 10"
TOOL_EXAMPLE[slow_requests]="chiamate lente di stamattina sul nodo 4 di prod"
TOOL_EXAMPLE[traffic_volume]="volume traffico del nodo 7 in mattinata"
TOOL_EXAMPLE[filter_ip]="chi ha fatto più richieste sul nodo 2"
TOOL_EXAMPLE[tail_log]="ultime 50 righe del log"
TOOL_EXAMPLE[filter_errors]="errori nel server log del nodo 3"
TOOL_EXAMPLE[filter_app_errors]="errori applicativi nascosti sul nodo 8"
TOOL_EXAMPLE[service_times]="tempi dei servizi di stamattina"
TOOL_EXAMPLE[gc_stats]="statistiche GC del nodo 5"
TOOL_EXAMPLE[correlate_gc_slow]="il GC sta causando lentezza sul nodo 6?"
TOOL_EXAMPLE[tail_named_log]="ultime 100 righe del api.log sul nodo 9"
TOOL_EXAMPLE[grep_named_log]="errori nel cc.log del nodo 12"
TOOL_EXAMPLE[search_all_logs]="cerca NullPointerException nei log del nodo 5"
TOOL_EXAMPLE[list_logs]="che log ci sono sul nodo 5"
TOOL_EXAMPLE[show_help]=""

# ─── Soglie di severità per la colorazione (UI-13) ────────────────────────────
# Governano quando un valore diventa giallo (WARN) o rosso (CRIT) nell'output.
# Prima erano dentro gli .awk, quindi tararle su un ambiente richiedeva di
# editare il codice — mentre sono proprio i valori che cambiano da ambiente a
# ambiente.
#
# I nomi dicono a COSA si riferiscono, non solo "quanto": `SLOW_MS` era definito
# due volte con valori diversi (200 nel GC, 2000 nei servizi) — corretto nel
# merito, ma il nome identico suggeriva una costante condivisa che non esisteva,
# ed era una trappola per chi le avesse "unificate".
#
# I valori sono quelli storici: cambiarli qui NON altera cosa il bot trova, solo
# quando lo evidenzia. Ogni tool ha un fallback identico nel proprio BEGIN, così
# un'invocazione diretta (test, debug) si comporta come prima.

# Pause GC: 200ms è già percepibile su una richiesta, 500ms è grave
GC_PAUSE_WARN_MS="${GC_PAUSE_WARN_MS:-200}"
GC_PAUSE_CRIT_MS="${GC_PAUSE_CRIT_MS:-500}"

# Tempi dei servizi backend: soglie molto più alte del GC — 200ms per una
# chiamata a servizio è normale, per una pausa GC è grave
SVC_TIME_WARN_MS="${SVC_TIME_WARN_MS:-2000}"
SVC_TIME_CRIT_MS="${SVC_TIME_CRIT_MS:-5000}"

# Tempo di risposta delle richieste HTTP (filter_ip, slow_requests)
REQ_TIME_WARN_MS="${REQ_TIME_WARN_MS:-1000}"
REQ_TIME_CRIT_MS="${REQ_TIME_CRIT_MS:-5000}"

# Occupazione heap dopo GC: oltre l'85% la JVM è in sofferenza
HEAP_USED_WARN_PCT="${HEAP_USED_WARN_PCT:-70}"
HEAP_USED_CRIT_PCT="${HEAP_USED_CRIT_PCT:-85}"

# Percentuale di richieste lente correlate a una pausa GC: oltre il 30% il GC
# è probabilmente la causa, sotto il 10% non lo è
GC_CORR_WARN_PCT="${GC_CORR_WARN_PCT:-10}"
GC_CORR_CRIT_PCT="${GC_CORR_CRIT_PCT:-30}"

# Lift (GCCORR-1): quante volte più correlate le lente rispetto alle veloci
# sullo stesso traffico. 1,0 = il GC non discrimina, è solo denso nel tempo.
GC_CORR_LIFT_WARN="${GC_CORR_LIFT_WARN:-1.5}"
GC_CORR_LIFT_CRIT="${GC_CORR_LIFT_CRIT:-3.0}"

# Copertura temporale delle pause (±margine) sulla finestra osservata: oltre
# questa soglia il GC è così pervasivo che la vicinanza non è più
# discriminante, e il verdetto passa a "pervasivo" invece di "non è la causa".
GC_CORR_COVER_SAT_PCT="${GC_CORR_COVER_SAT_PCT:-80}"

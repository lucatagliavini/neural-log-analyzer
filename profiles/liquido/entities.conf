#!/bin/bash
#
# entities.conf — dizionario di normalizzazione delle entità per il profilo "liquido".
#
# Scopo: mappare nomi concreti (app, ambienti, nodi) a placeholder canonici
#        (<APP>, <ENV>, <NODE>) prima della vectorizzazione della query.
#        Questo disaccoppia il classificatore dai nomi specifici del cliente:
#        aggiungere una nuova applicazione richiede solo una riga qui, non un retrain.
#
# Sourciato da: lib/normalize-query.sh
# NON richiede riaddestramento (solo la mappa cambia, non le feature).
# Richiede riaddestramento se si aggiungono nuovi PLACEHOLDER non ancora nel vocabolario.
#

# ─── Applicazioni → <APP> ─────────────────────────────────────────────────────
# Chiave: alias in minuscolo come appare nella query utente (case-insensitive).
# Valore: placeholder canonico.
# Ordine: dal più lungo al più corto — longest-match applicato da normalize-query.sh.
declare -A ENTITY_APP=(
    [contactmanager]="<APP>"
    [claimcenter]="<APP>"
    [guidewire]="<APP>"
    [liquido]="<APP>"
    [jboss]="<APP>"
)

# ─── Risoluzione inversa: nome app riconosciuto → label canonica ──────────────
# Usata da dispatch.sh e utils-logfiles.sh per costruire i path dei log.
# La chiave è il token riconosciuto nella query (minuscolo), il valore è il nome
# usato in APP_SUBPATH e GUIDEWIRE_SUBPATH di system.conf.
declare -A APP_CANONICAL=(
    [contactmanager]="ContactManager"
    [claimcenter]="ClaimCenter"
    [guidewire]="ClaimCenter"       # "guidewire" → app di default del profilo
    [liquido]="ClaimCenter"         # alias colloquiale del profilo
    [jboss]="ClaimCenter"           # alias tecnico del middleware
)

# ─── Ambienti → <ENV> ────────────────────────────────────────────────────────
# ENTITY_ENV è costruita invertendo ENV_NODE_CODE da system.conf:
#   chiave ENV_NODE_CODE (es. "prod") → placeholder "<ENV>"
# Viene popolata dinamicamente in normalize-query.sh dopo aver sourcato system.conf,
# quindi non va definita qui per evitare duplicazione.
# Sinonimi colloquiali (non presenti in ENV_NODE_CODE) vengono gestiti a parte.
declare -A ENV_SYNONYMS=(
    [produzione]="prod"
    [integrazione]="inte"
    [collaudo]="coll"
    [certificazione]="cert"
    [certificazione]="cert"
    [europeo]="euro"
)

# ─── Log applicativi specifici del profilo ───────────────────────────────────
# Nomi (senza .log) riconosciuti da param-extract.sh per il parametro NAMED_LOG.
# Aggiungere qui i nomi dei log specifici del middleware/applicazione del profilo.
APP_LOG_NAMES=(
    cc
    api
    database
    messaging
    performance_integr
    jgroups
    plugin
    ruleengine
    studio
    ccJBatch
    ccCanaliz
    claimnumgen
    contactsearch
    velocity
    arbitrato
)

# ─── Abbreviazioni app → nome canonico (per normalize-query.sh sezione 4) ────
# Abbrev. brevi risolte *dopo* ENV/NODE per evitare collisioni con codici env.
# Chiave: token come appare nella query (minuscolo). Valore: valore di DETECTED_APP.
declare -A APP_SHORT_ALIASES=(
    [cc]="claimcenter"
    [cm]="contactmanager"
)
# Regex alternativa per alias multi-parola (stessa sezione 4).
# Es: "contact.?manager" cattura "contact manager" e "contactmanager".
declare -A APP_ALIAS_REGEX=(
    [claimcenter]=""
    [contactmanager]="contact.?manager"
)

# ─── Nodi → <NODE> ────────────────────────────────────────────────────────────
# I nodi sono identificati da pattern numerici, non da un dizionario fisso.
# Pattern ERE gestiti da normalize-query.sh:
#   "nodo 3", "nodo3", "nodo numero 3"  → <NODE>, DETECTED_NODE=3
#   "worker1", "worker 1"               → <NODE>, DETECTED_NODE=1
#   "lxprworkerliq01" (hostname)        → <NODE>, DETECTED_NODE=1
NODE_PATTERNS=(
    'nodo[[:space:]]*numero[[:space:]]*([0-9]+)'
    'nodo[[:space:]]*([0-9]+)'
    'worker[[:space:]]*([0-9]+)'
    'lx[a-z]+worker[a-z]+([0-9]+)'
)

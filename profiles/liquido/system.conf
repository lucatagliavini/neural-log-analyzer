#!/bin/bash
#
# system.conf — configurazione infrastrutturale per il profilo "liquido".
# Contiene: path base dei log, mappa ambienti, struttura directory, app disponibili.
#
# Modificare questo file NON richiede riaddestramento del modello.
#

# ─── Filesystem log ──────────────────────────────────────────────────────────
# Sul server dedicato al bot (lxprworkerlana01) i log sono organizzati per
# PROFILO: /unipol/logs/farmlog/<profilo>/<env>/<nodo>/... — così più profili
# (liquido, usnext, …) convivono sulla stessa macchina, ognuno con i propri
# ambienti. Da qui in giù la struttura è identica a prima, quindi il cambio è
# solo di questa riga: nessun codice presume il livello <profilo>.
#
# Resta sovrascrivibile dall'ambiente e da system.local.conf (non deployato), per
# un'installazione che monti i log altrove.
LOG_BASE_DIR="${LOG_BASE_DIR:-/unipol/logs/farmlog/liquido}"

# Timezone del server di log (tzdata name, es: "Europe/Rome").
# Lasciare vuoto per usare il TZ di sistema (comportamento sicuro se macchina
# di analisi e server log sono nella stessa zona).
LOG_TZ="${LOG_TZ:-Europe/Rome}"

# ─── Applicazioni disponibili su questo sistema ──────────────────────────────
DEFAULT_APP="ClaimCenter"
AVAILABLE_APPS=("ClaimCenter" "ContactManager")

# ─── Mappa ambiente → codice nel nome host (lx<CODE>jbliq<NN>) ───────────────
declare -A ENV_NODE_CODE
ENV_NODE_CODE[test]="ts"
ENV_NODE_CODE[euro]="eu"
ENV_NODE_CODE[coll]="pp"
ENV_NODE_CODE[inte]="in"
ENV_NODE_CODE[cert]="ce"
ENV_NODE_CODE[prod]="pr"

# ─── Ricerca cross-log ───────────────────────────────────────────────────────
# Numero massimo di worker paralleli per search_all_logs.
#
# Tenuto a 4 su misura, non per prudenza: benchmark su 120 file reali di
# produzione (nodo a 16 core, 2026-08-06) mostra che il carico di lavoro è
# I/O-bound, non CPU-bound — alzare i worker non paga il carico che aggiunge:
#   jobs=4  → 41.7s (load 7.9)     jobs=12 → 36.7s (load 19.2)
#   jobs=8  → 42.9s (load 16.9)    jobs=16 → 34.8s (load 23.7)
#                                  jobs=24 → 34.6s (load 24.4)
# Da 4 a 24 si guadagna il 17% triplicando il load average, su un nodo dove
# girano anche JBoss e Guidewire. Il vero guadagno è venuto da `wait -n` nel
# pool (2.6× a parità di worker, vedi search_all_logs.sh).
# Alzare solo su nodi dedicati; abbassare a 2 se il nodo è sotto carico.
SEARCH_PARALLEL_JOBS="${SEARCH_PARALLEL_JOBS:-4}"

# ─── Log delle query e delle performance ─────────────────────────────────────
# Directory in cui scrivere i log di utilizzo (chatbot-YYYY-MM-DD.log, TSV a
# 13 colonne: query, tool attivati, tempi per fase, volumi — vedi log_query()
# in chatbot.sh e ./perf-report.sh per l'analisi).
#
# NON impostata qui: chatbot.sh applica il default `<dir di chatbot.sh>/logs`,
# che funziona in qualsiasi installazione senza configurazione per-host
# (`logs/` è escluso da deploy.sh e .gitignore, quindi i dati accumulati non
# vengono sovrascritti dai deploy né committati).
# Per cambiarla, decommentare qui o metterla in system.local.conf.
# Per DISATTIVARE il logging: `QUERY_LOG_DIR= ./chatbot.sh ...` (valore vuoto
# esplicito nell'ambiente).
# QUERY_LOG_DIR="/percorso/alternativo"
# Giorni di log da conservare; i file più vecchi vengono rimossi all'uscita del bot.
QUERY_LOG_RETENTION_DAYS="${QUERY_LOG_RETENTION_DAYS:-15}"

# ─── Log DEBUG interno (lib/utils-log.sh) ─────────────────────────────────────
# Livello: debug|info|warn|error|off. "debug" mostra le decisioni di pruning
# della selezione file (quale rotazione letta/saltata e perché) — vedi
# select_log_files_grouped in utils-logfiles.sh.
BOT_LOG_LEVEL="${BOT_LOG_LEVEL:-warn}"
# File di destinazione. Vuoto = stderr (mai stdout: i tool ci scrivono
# l'output formattato su cui asseriscono i test).
BOT_LOG_FILE="${BOT_LOG_FILE:-}"

# ─── Feedback progressivo ─────────────────────────────────────────────────────
# "⋯ selezione log: <file>" mostrato durante le fasi lente, su stderr e solo
# se stderr è un terminale. "off" lo disattiva anche in interattivo.
BOT_PROGRESS="${BOT_PROGRESS:-on}"

# ─── Application server ──────────────────────────────────────────────────────
# Formato del log applicativo. Determina quale parser AWK usa dispatch.sh
# (utils-jboss.awk, utils-websphere.awk, ...) e quali keyword riconosce
# param-extract.sh quando l'utente dice "log jboss" / "log websphere".
SERVER_LOG_FORMAT="jboss"

# Basename (senza estensione) dei tre tipi di log su disco.
# I tool usano questi valori per trovare i file tramite select_log_files().
ACCESS_LOG_BASE="undertow_access_log"
SERVER_LOG_BASE="server"
GC_LOG_BASE="gc"

# Sinonimi con cui gli utenti nominano un log di sistema senza usarne il
# basename esatto — chiave: parola digitata (minuscolo), valore: uno dei tre
# *_LOG_BASE sopra. Qui serve solo per "access": SERVER_LOG_BASE/GC_LOG_BASE
# coincidono già con la parola naturale, quindi non hanno bisogno di alias.
# _is_system_log_base() (utils-logfiles.sh) la consulta insieme al confronto
# esatto — un solo punto di verità condiviso da normalize-query.sh,
# param-extract.sh e dispatch.sh:list_available_logs.
declare -A SYSTEM_LOG_SYNONYMS=(
    [access]="undertow_access_log"
    [accesso]="undertow_access_log"
)

# ─── Struttura directory sotto il nome host ───────────────────────────────────
# NODE_NAME_TEMPLATE: template per il nome dell'host nodo.
# Variabili disponibili: ENV_CODE (da ENV_NODE_CODE), NODE_NUM (zero-padded)
NODE_NAME_TEMPLATE='lx${ENV_CODE}jbliq${NODE_NUM}'

# NODE_HOST_REGEX: pattern ERE per riconoscere un hostname nodo nella query utente.
# Usato da normalize-query.sh per estrarre DETECTED_NODE da hostname completi.
NODE_HOST_REGEX='lx[a-z]{2}[a-z]+[a-z]{2}[0-9]+'

# APP_SUBPATH — NON più usata dal codice (rimossa con CLEAN-1, 2026-08-17).
# Descriveva il sotto-path da NODE_DIR ai log dell'app, ed era l'assunzione di
# layout che i tool usavano per costruire i path. Da LOGDISC-4 i log di sistema
# sono SCOPERTI sotto la directory del nodo (principio 6), quindi nessun percorso
# la consulta più.
#
# Resta qui come DOCUMENTAZIONE del layout tipico di questo profilo — utile a chi
# legge la config per capire com'è organizzato il filesystem, inutile al codice.
# Non aggiungerne di nuove: un percorso che ha bisogno di sapere dove sta un log
# deve cercarlo, non dedurlo (`resolve_system_log_dir`, `resolve_log_glob`,
# `discover_log_dirs`).
#   layout osservato: <nodo>/$ENV_NAME/$APP

# CUSTOM_LOG_SUBPATH: sotto-path da NODE_DIR alla directory dei log
# applicativi custom (cartella flat, formato non standard JBoss/Undertow —
# su questo sistema sono i log Guidewire: cc.log, api.log, database.log...).
# Lasciare vuoto se il sistema non ha log di questo tipo.
# Variabili disponibili: APP
CUSTOM_LOG_SUBPATH='$APP/Guidewire'

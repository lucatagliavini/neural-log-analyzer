# light — sfondo chiaro.
#
# Differenza chiave rispetto a dark: C_VAL è BOLD, non bianco. Il bianco puro
# (97) su sfondo chiaro è illeggibile, ed era l'assunzione implicita non
# dichiarata del codice pre-temi (17 usi in gc_stats.awk).
# L'accento passa da ciano a blu (34): il ciano su bianco ha contrasto
# insufficiente (rapporto ~1.5:1, sotto qualsiasi soglia di leggibilità).
# C_LBL usa il grigio 90 anziché DIM: su molti terminali chiari `\033[2m`
# rende un grigio troppo vicino al bianco di fondo.
C_CRIT="\033[31m"
C_WARN="\033[38;5;130m"
C_OK="\033[32m"
C_VAL="\033[1m"
C_LBL="\033[90m"
C_ACCENT="\033[34m"
C_ROW_ALT="\033[47m"
C_BOLD="\033[1m"
C_RESET="\033[0m"

# C_ACCENT è blu (leggibile su chiaro); per le categorie serve un secondo colore
# che non sia una severità: magenta.
C_INFO="\033[36m"
C_TAG="\033[35m"

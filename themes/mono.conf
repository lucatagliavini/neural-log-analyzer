# mono — nessuna sequenza ANSI. DEFAULT del progetto.
#
# Pensato per: servizi che consumano l'output come testo, redirect su file,
# sistemi di ticket, terminali senza supporto ANSI.
#
# Tutte le variabili sono VUOTE, bold compreso: per un servizio che vuole
# output testuale anche `\033[1m` è sporcizia nel contenuto, non
# "formattazione neutra". Se serve la gerarchia visiva senza colori — es. su
# un terminale monocromatico ma capace di ANSI — usare il tema `plain`.
#
# Verificabile: `./chatbot.sh --query ... | grep -c $'\033'` deve dare 0.
C_CRIT=""
C_WARN=""
C_OK=""
C_VAL=""
C_LBL=""
C_ACCENT=""
C_ROW_ALT=""
C_BOLD=""
C_RESET=""

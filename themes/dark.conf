# dark — sfondo scuro. Riproduce esattamente il comportamento pre-temi
# (2026-08-06), quindi serve anche come baseline per verificare che il
# refactoring non abbia cambiato la resa.
#
# C_VAL è il bianco puro ISO 6429 (97), non il colore di default del
# terminale: su sfondo scuro fa risaltare i numeri. È anche la ragione per cui
# questo tema NON va usato su sfondo chiaro, dove sparirebbe.
C_CRIT="\033[31m"
C_WARN="\033[33m"
C_OK="\033[32m"
C_VAL="\033[97m"
C_LBL="\033[2m"
C_ACCENT="\033[36m"
# Sfondo righe alternate: 48;5;237 (grigio scuro della palette 256) e non
# \033[100m (bright-black). Il 100m rende un grigio CHIARO e la sua tonalità
# varia molto fra terminali: sopra ci vanno il nome del nodo e del log, che
# risultavano poco leggibili (segnalato dall'utente, 2026-08-06 — il problema
# non si presentava in dark-cool, che usa già la palette 256).
C_ROW_ALT="\033[48;5;237m"
# Testo sulla riga con sfondo: bianco pieno, non dim. C_LBL è dim, e dim su uno
# sfondo colorato avvicina il testo al fondo per costruzione.
C_ROW_ALT_FG="\033[97m"
C_BOLD="\033[1m"
C_RESET="\033[0m"

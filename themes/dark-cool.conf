# dark-cool — sfondo scuro, palette fredda.
#
# Progettato anche per la discromatopsia rosso-verde (deuteranopia/protanopia,
# ~8% dei maschi): critico e "ok" non si distinguono per tonalità rosso/verde
# ma per magenta/ciano, che restano separati anche senza percezione del rosso.
# Il warn resta giallo, che è l'unico dei tre visibile in tutte le forme di
# discromatopsia comune.
C_CRIT="\033[35;1m"
C_WARN="\033[33m"
C_OK="\033[36m"
C_VAL="\033[97m"
C_LBL="\033[2m"
C_ACCENT="\033[34;1m"
C_ROW_ALT="\033[48;5;237m"
C_BOLD="\033[1m"
C_RESET="\033[0m"

# Testo sulla riga con sfondo alternato: bianco pieno, coerente con gli altri temi scuri.
C_ROW_ALT_FG="\033[97m"

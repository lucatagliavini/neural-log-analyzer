# light-vivid — sfondo chiaro, massima distinzione.
#
# Per proiettori e schermi condivisi, dove il contrasto reale è molto inferiore
# a quello del monitor su cui si è scritto il codice: colori a piena
# saturazione SEMPRE combinati con bold, perché su un proiettore sbiadito il
# solo colore non basta a distinguere.
C_CRIT="\033[31;1m"
C_WARN="\033[33;1m"
C_OK="\033[32;1m"
C_VAL="\033[1m"
C_LBL="\033[90m"
C_ACCENT="\033[35;1m"
C_ROW_ALT="\033[47m"
C_BOLD="\033[1m"
C_RESET="\033[0m"

# Testo sulla riga con sfondo alternato: nero su sfondo 47m.
C_ROW_ALT_FG="\033[30m"

# Gradiente barre (1 = valore basso, 5 = alto).
# Magenta a piena saturazione: su proiettore stacca dal fondo bianco piu
# del rosso, che tende a sbiadire.
C_BAR_1="\033[38;5;219m"
C_BAR_2="\033[38;5;213m"
C_BAR_3="\033[38;5;201m"
C_BAR_4="\033[38;5;164m"
C_BAR_5="\033[38;5;127m"

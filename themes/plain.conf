# plain — nessun colore, ma gerarchia visiva con bold/dim.
#
# Via di mezzo tra mono (zero ANSI) e i temi a colori: per terminali
# monocromatici che però supportano gli attributi, o per chi trova i colori
# fastidiosi ma vuole distinguere i valori dalle etichette.
# Non adatto a output destinato a un file: contiene sequenze ANSI.
C_CRIT="\033[1m"
C_WARN="\033[1m"
C_OK=""
C_VAL="\033[1m"
C_LBL="\033[2m"
C_ACCENT="\033[4m"
C_ROW_ALT=""
C_BOLD="\033[1m"
C_RESET="\033[0m"

# Nessuno sfondo alternato in questo tema: nessun foreground dedicato.
C_ROW_ALT_FG=""

# Gradiente barre (1 = valore basso, 5 = alto).
# Nessun colore: i due livelli piu alti usano bold, cosi la barra piu lunga
# resta distinguibile senza tinte.
C_BAR_1=""
C_BAR_2=""
C_BAR_3=""
C_BAR_4="\033[1m"
C_BAR_5="\033[1m"

# plain — nessun colore, ma gerarchia visiva con bold/dim.
#
# Via di mezzo tra mono (zero ANSI) e i temi a colori: per terminali
# monocromatici che però supportano gli attributi, o per chi trova i colori
# fastidiosi ma vuole distinguere i valori dalle etichette.
# Non adatto a output destinato a un file: contiene sequenze ANSI.
C_CRIT="\033[1m"
C_WARN="\033[1m"
C_OK=""
C_VAL="\033[1m"
C_LBL="\033[2m"
C_ACCENT="\033[4m"
C_ROW_ALT=""
C_BOLD="\033[1m"
C_RESET="\033[0m"

# light-soft — sfondo chiaro, contrasto ridotto.
#
# Per lettura prolungata: tinte desaturate dalla palette 256 colori, che
# affaticano meno del rosso/verde pieni su fondo bianco. Il critico resta
# comunque il più scuro dei tre, così la gerarchia di severità sopravvive
# alla desaturazione — è il vincolo che distingue un tema "soft" utilizzabile
# da uno solo più tenue.

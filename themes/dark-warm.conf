# dark-warm — sfondo scuro, palette calda.
#
# Alternativa a dark per chi trova il ciano freddo/stridente su sfondo scuro:
# l'accento passa a giallo tenue e il critico a rosso brillante (31;1), che su
# fondo nero stacca più del rosso base senza virare all'arancio.
# I 7 ruoli mantengono la stessa semantica: cambia solo la resa.
C_CRIT="\033[31;1m"
C_WARN="\033[38;5;214m"
C_OK="\033[32m"
C_VAL="\033[97m"
C_LBL="\033[2m"
C_ACCENT="\033[38;5;180m"
C_ROW_ALT="\033[48;5;236m"
C_BOLD="\033[1m"
C_RESET="\033[0m"

# C_ACCENT qui è giallo tenue, troppo vicino a C_WARN per marcare una categoria:
# C_TAG usa il ciano, che in questo tema non è usato per nessuna severità.
C_INFO="\033[36m"
C_TAG="\033[36m"

# Testo sulla riga con sfondo alternato: bianco pieno: lo sfondo 236 è scuro, il contrasto è massimo.
C_ROW_ALT_FG="\033[97m"

# Gradiente barre (1 = valore basso, 5 = alto).
# Scala di calore (oliva->ambra->arancio->rosso), coerente con la palette
# calda di questo tema.
C_BAR_1="\033[38;5;58m"
C_BAR_2="\033[38;5;136m"
C_BAR_3="\033[38;5;172m"
C_BAR_4="\033[38;5;208m"
C_BAR_5="\033[38;5;196m"

# high-contrast — accessibilità, indipendente dallo sfondo.
#
# Regole: nessun DIM (che riduce il contrasto per definizione), nessuna tinta
# tenue o dalla palette 256 (che alcuni terminali approssimano male), solo i
# colori base a piena intensità SEMPRE con bold.
# C_LBL è bold e non attenuato: qui anche l'etichetta deve restare leggibile —
# è il caso in cui una gerarchia visiva meno marcata è preferibile a
# un'informazione che qualcuno non riesce a leggere.
C_CRIT="\033[31;1m"
C_WARN="\033[33;1m"
C_OK="\033[32;1m"
C_VAL="\033[1m"
C_LBL="\033[1m"
C_ACCENT="\033[36;1m"
C_ROW_ALT=""
C_BOLD="\033[1m"
C_RESET="\033[0m"

# Accessibilità: anche i ruoli neutri devono restare leggibili, quindi bold.
C_INFO="\033[36;1m"
C_TAG="\033[35;1m"

# Nessuno sfondo alternato in questo tema: nessun foreground dedicato.
C_ROW_ALT_FG=""

# Gradiente barre (1 = valore basso, 5 = alto).
# Accessibilita: NON un gradiente di luminosita (indistinguibile per chi ha
# bassa sensibilita al contrasto) ma cinque colori base a piena intensita, che
# restano separati anche su terminali scadenti.
C_BAR_1="\033[37m"
C_BAR_2="\033[37;1m"
C_BAR_3="\033[36;1m"
C_BAR_4="\033[33;1m"
C_BAR_5="\033[31;1m"
